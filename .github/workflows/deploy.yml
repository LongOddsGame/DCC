name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the build version (1.0.0.date.time, Detroit time)
        run: |
          VERSION="1.0.0.$(TZ=America/Detroit date +%Y%m%d.%H%M)"
          echo "Building $VERSION"
          mkdir -p _site
          cp -r index.html css js _site/
          grep -rl "__BUILD_VERSION__" _site | xargs sed -i "s/__BUILD_VERSION__/$VERSION/g"
          echo "{ \"version\": \"$VERSION\" }" > _site/version.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub sometimes cannot find the uploaded site for a few seconds. Wait and try again.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
