<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Long Odds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tiny5&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=__BUILD_VERSION__">
</head>
<body>
<div id="app">
  <header id="hud" hidden>
    <div class="hud-row hud-top">
      <span id="hud-floor">F1 THE LOBBY</span>
      <span id="hud-timer"></span>
      <span id="hud-odds">8 TO 1</span>
    </div>
    <div class="hud-row hud-bars">
      <span class="bar-label">HP</span>
      <div class="bar"><div id="hp-fill" class="fill hp"></div></div>
      <span id="hp-text" class="bar-num">40</span>
      <span class="bar-label">MP</span>
      <div class="bar"><div id="mp-fill" class="fill mp"></div></div>
      <span id="mp-text" class="bar-num">12</span>
    </div>
    <div class="hud-row hud-bars">
      <span class="bar-label">XP</span>
      <div class="bar thin"><div id="xp-fill" class="fill xp"></div></div>
      <span id="xp-text" class="bar-num wide">0/20</span>
    </div>
    <div class="hud-row hud-sub">
      <span>LV <b id="hud-lvl">1</b></span>
      <span>Hype <b id="hud-hype" class="hype">▯▯▯▯▯</b></span>
      <span>Tokens <b id="hud-tokens">0</b></span>
    </div>
  </header>
  <main id="stage"><canvas id="game" width="240" height="160" aria-label="Game screen"></canvas></main>
  <section id="textbox" aria-live="polite"></section>
  <section id="controls"></section>
  <div id="overlay" hidden></div>
</div>
<script type="module" src="js/main.js?v=__BUILD_VERSION__"></script>
</body>
</html>
