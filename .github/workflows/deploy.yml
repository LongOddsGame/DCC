name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Every release bumps the last number (1.0.1, 1.0.2, ...), then adds the date and time.
      # Run 13 was the first release with this scheme, so it became 1.0.1.
      - name: Stamp the build version (1.0.N.date.time, Detroit time)
        run: |
          PATCH=$(( ${{ github.run_number }} - 12 ))
          VERSION="1.0.${PATCH}.$(TZ=America/Detroit date +%Y%m%d.%H%M)"
          echo "Building $VERSION"
          mkdir -p _site
          cp -r index.html css js _site/
          grep -rl "__BUILD_VERSION__" _site | xargs sed -i "s/__BUILD_VERSION__/$VERSION/g"
          echo "{ \"version\": \"$VERSION\" }" > _site/version.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub sometimes cannot find the uploaded site for a few seconds. Wait and try again.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
