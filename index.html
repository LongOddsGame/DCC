<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Long Odds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tiny5&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=__BUILD_VERSION__">
</head>
<body>
<div id="app">
  <div id="hurt" aria-hidden="true"></div>
  <header id="hud" hidden>
    <div class="hud-row hud-top">
      <span id="hud-floor">F1 THE LOBBY</span>
      <span id="hud-timer"></span>
      <span id="hud-odds">1000 TO 1</span>
    </div>
    <div class="hud-row hud-bars">
      <span class="bar-label">HP</span>
      <div class="bar"><div id="hp-fill" class="fill hp"></div></div>
      <span id="hp-text" class="bar-num">40</span>
      <span class="bar-label">MP</span>
      <div class="bar"><div id="mp-fill" class="fill mp"></div></div>
      <span id="mp-text" class="bar-num">12</span>
    </div>
    <div class="hud-row hud-bars">
      <span class="bar-label">XP</span>
      <div class="bar thin"><div id="xp-fill" class="fill xp"></div></div>
      <span id="xp-text" class="bar-num wide">0/20</span>
    </div>
    <div class="hud-row hud-sub">
      <span>LV <b id="hud-lvl">1</b></span>
      <span>Hype <b id="hud-hype" class="hype">▯▯▯▯▯</b></span>
      <span>Tokens <b id="hud-tokens">0</b></span>
    </div>
  </header>
  <main id="stage"><canvas id="game" width="240" height="160" aria-label="Game screen"></canvas><button id="boxpop" class="btn gold" hidden>OPEN BOXES</button></main>
  <section id="textbox" aria-live="polite"></section>
  <section id="controls"></section>
  <div id="overlay" hidden></div>
</div>
<script>
// Crash catcher (owner asked after a crash on respawn). Any error shows a small note at the top of
// the screen that can be screenshotted, and the last 5 errors ride along with the next play stats email.
(function () {
  var shown = {};
  function note(msg, where) {
    var text = String(msg || 'Unknown error') + (where ? ' (' + where + ')' : '');
    if (shown[text]) return;
    shown[text] = 1;
    try {
      var list = JSON.parse(localStorage.getItem('longodds.errors') || '[]');
      list.push({ t: new Date().toISOString(), e: text.slice(0, 300), b: '__BUILD_VERSION__' });
      localStorage.setItem('longodds.errors', JSON.stringify(list.slice(-5)));
    } catch (_) { /* storage blocked */ }
    function show() {
      var box = document.getElementById('errnote');
      if (!box) { box = document.createElement('div'); box.id = 'errnote'; document.body.appendChild(box); }
      box.innerHTML = '<b>Oops, something broke.</b> Screenshot this for Claude, then tap Keep playing.<br><code></code><br>'
        + '<button type="button" data-k="close">Keep playing</button> <button type="button" data-k="reload">Restart game</button>';
      box.querySelector('code').textContent = text + ' · Build __BUILD_VERSION__';
      box.onclick = function (e) {
        var k = e.target && e.target.getAttribute('data-k');
        if (k === 'close') box.remove();
        if (k === 'reload') location.reload();
      };
    }
    if (document.body) show(); else addEventListener('DOMContentLoaded', show);
  }
  function where(file, line) { return file ? String(file).split('/').pop().split('?')[0] + ':' + line : ''; }
  // Where it broke, short: "drawTile main.js:3860 < drawMap main.js:3901".
  function trace(stack) {
    return String(stack || '').split('\n').filter(function (l) { return /\.js/.test(l); }).slice(0, 3).map(function (l) {
      var m = l.match(/(?:at )?([\w$.]*)[ @(]*\S*\/([\w.-]+\.js)[^:]*:(\d+)/);
      return m ? (m[1] ? m[1] + ' ' : '') + m[2] + ':' + m[3] : l.trim();
    }).join(' < ');
  }
  window.__loErr = function (err) { note(err && err.message || err, err && err.stack ? trace(err.stack) : ''); };
  addEventListener('error', function (e) { if (e.message) note(e.message, where(e.filename, e.lineno)); });
  addEventListener('unhandledrejection', function (e) { window.__loErr(e.reason); });
})();
</script>
<script type="module" src="js/main.js?v=__BUILD_VERSION__"></script>
</body>
</html>
